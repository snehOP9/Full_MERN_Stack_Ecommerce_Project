name: Monthly income regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - "Backend/controller/userCtrl.js"
      - "Backend/utils/monthlyOrderIncome.js"
      - "Backend/tests/**"
      - "Backend/package*.json"
      - "Admin/src/pages/Dashboard.js"
      - "Admin/src/utils/monthlyOrderData*"
      - ".github/workflows/monthly-income-tests.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - name: Test monthly income pipeline
        run: npm test

  admin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Admin/package-lock.json
      - run: npm ci
      - name: Test distinct month-year chart labels
        run: CI=true npm test -- --watch=false --runInBand
