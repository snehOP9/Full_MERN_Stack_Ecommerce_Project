name: Checkout regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - "Frontend/src/pages/Checkout.js"
      - "Frontend/src/utils/**"
      - "Frontend/package*.json"
      - ".github/workflows/checkout-tests.yml"

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - name: Run checkout regression tests
        run: CI=true npm test -- --watch=false --runInBand
